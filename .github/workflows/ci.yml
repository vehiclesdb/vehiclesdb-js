name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The dataset release the conformance job runs against. Bump it when a new
  # release changes RESOLUTION.md or conformance/resolve.json.
  DATASET_TAG: v2026.11.2

jobs:
  test:
    name: unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Offline, against fixtures/ only. The full-release and conformance
      # layers skip loudly here; the conformance job below runs them.
      - run: npm test

  conformance:
    name: conformance (full release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The released tree the full-release tests read: manifest.json, the
      # per-kind catalog and the language-neutral conformance suite.
      - uses: actions/checkout@v4
        with:
          repository: vehiclesdb/vehiclesdb
          ref: ${{ env.DATASET_TAG }}
          path: .dataset
          sparse-checkout: |
            dist/vehicles.json
            manifest.json
            catalog
            conformance
          sparse-checkout-cone-mode: false
      - name: Download the release's vehicles.json
        run: |
          curl -sSfL -o "$RUNNER_TEMP/vehicles.json" \
            "https://github.com/vehiclesdb/vehiclesdb/releases/download/${DATASET_TAG}/vehicles.json"
          cmp "$RUNNER_TEMP/vehicles.json" .dataset/dist/vehicles.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm test (fixtures + full release + conformance)
        env:
          VDB_DATA: ${{ runner.temp }}/vehicles.json
          VDB_DATA_REPO: ${{ github.workspace }}/.dataset
          VDB_CONFORMANCE: ${{ github.workspace }}/.dataset/conformance/resolve.json
        run: |
          npm test | tee "$RUNNER_TEMP/tap.txt"
          # Every layer must have run: a skipped conformance case is a failure here.
          grep -q '^# skipped 0$' "$RUNNER_TEMP/tap.txt"

  parity:
    name: parity with vehiclesdb-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vehiclesdb-js
      # The sibling SDK at the branch of the same name when one exists (a
      # cross-SDK change lands as a PR pair), else main.
      - name: Pick the vehiclesdb-python ref
        id: sibling
        run: |
          ref="${GITHUB_HEAD_REF:-main}"
          git ls-remote --exit-code --heads https://github.com/vehiclesdb/vehiclesdb-python "$ref" >/dev/null || ref=main
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: vehiclesdb/vehiclesdb-python
          ref: ${{ steps.sibling.outputs.ref }}
          path: vehiclesdb-python
      - uses: actions/checkout@v4
        with:
          repository: vehiclesdb/vehiclesdb
          ref: ${{ env.DATASET_TAG }}
          path: vehiclesdb
          sparse-checkout: |
            dist/vehicles.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fixtures are byte-identical across the two SDKs
        run: diff -r vehiclesdb-js/fixtures vehiclesdb-python/fixtures
      - name: Parity over fixtures/
        run: bash vehiclesdb-js/tools/parity_check.sh
      - name: Parity over the full release
        run: bash vehiclesdb-js/tools/parity_check.sh vehiclesdb

  package:
    name: npm pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tarball contains exactly the published entry points and types
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = require(process.argv[1])[0].files.map(f => f.path).sort()
            const want = ["CHANGELOG.md","CONTRACT.md","LICENSE","NOTICE","README.md","index.cjs","index.d.ts","index.mjs","package.json","resolution.cjs"]
            console.log(files.join("\n"))
            if (JSON.stringify(files) !== JSON.stringify(want)) { console.error("unexpected tarball contents"); process.exit(1) }
          ' "$RUNNER_TEMP/pack.json"
